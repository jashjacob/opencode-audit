name: Bug report
description: Report a reproducible problem
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Include the expected result and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenCode and plugin versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Remove secrets and private repository content before sharing logs.
    validations:
      required: true

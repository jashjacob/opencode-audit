name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Verify clean package contents
        run: |
          npm pack --dry-run
          node --input-type=module -e 'import { access, readFile } from "node:fs/promises"; import assert from "node:assert/strict"; const pkg = JSON.parse(await readFile("package.json", "utf8")); await access("dist/index.js"); assert.ok(pkg.dependencies?.["@opencode-ai/plugin"], "plugin API must be a runtime dependency");'
